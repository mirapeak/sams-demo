<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shepherd’s SAMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f3ee;--card:#fff;--tx:#1d2733;--mut:#6b7684;--pri:#1f3a5f;--acc:#b8941f;--bd:#e0dccf;--ok:#2e7d4f;--bad:#b3392f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171e;--card:#1b222c;--tx:#e8e6df;--mut:#9aa5b1;--pri:#7fa6d6;--acc:#d9b53f;--bd:#2c3542}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
.app{display:flex;min-height:100vh}.side{width:210px;background:var(--pri);color:#fff;padding:14px;flex-shrink:0}
.side h3{margin:6px 0 2px;font-size:14px}.side small{opacity:.7}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.side button.on,.side button:hover{background:rgba(255,255,255,.16)}
.main{flex:1;padding:18px;min-width:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px;color:var(--pri)}h4{margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.st b{display:block;font-size:24px;color:var(--pri)}.st span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mut);font-weight:600}
.w{overflow-x:auto}input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);max-width:100%}
td input[type=number]{width:70px}.btn{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
.btn.sec{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.acc{background:var(--acc);color:#1d2733}.btn.bad{background:var(--bad)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--bd)}.tag.Published{background:var(--ok);color:#fff}.tag.Submitted,.tag.Approved{background:var(--acc);color:#1d2733}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.demo{background:var(--acc);color:#1d2733;font-size:12px;padding:4px 10px;text-align:center}
.login{max-width:360px;margin:8vh auto;text-align:center}.login input{width:100%;margin:5px 0}.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}
.sheet{border:2px solid var(--pri)}.sh{display:flex;gap:12px;align-items:center;justify-content:center;text-align:center;border-bottom:2px solid var(--acc);padding-bottom:10px;margin-bottom:10px}
@media(max-width:700px){.app{flex-direction:column}.side{width:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center}.side button{width:auto}}
@media print{.side,.demo,.noprint{display:none!important}.main{padding:0}body{background:#fff;color:#000}}
</style></head><body>
<div class="demo noprint">DEMONSTRATION DATA · Phase 1 prototype · data is stored in this browser only</div>
<div id="root"></div>
<script>
const KEY='sams_v1',e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LP=["English Studies","Mathematics","Basic Science","Agricultural Science","Christian Religious Studies","National Values","History","Quantitative Reasoning","Verbal Reasoning","Phonics","Cultural & Creative Arts","Basic Writing"];
const NUR=["English Studies","Mathematics","Basic Science & Technology","Christian Religious Studies","Social Norms","Phonics","Verbal Reasoning","Quantitative Reasoning","Rhymes","Creative Art"];
const PRE=["English Studies","Mathematics","Science","Christian Religious Studies","Rhymes","Creative Art"];
const CLS=["Pre-Nursery","Nursery 1","Nursery 2","Nursery 3","Primary 1","Primary 2","Primary 3","Primary 4","Primary 5"];
const SESS='2026/2027',TERM='First Term',TODAY=new Date().toISOString().slice(0,10);
const USERS={admin:{pw:'admin123',role:'admin',name:'School Administrator'},teacher1:{pw:'teach123',role:'teacher',name:'Mrs. Grace Adamu'},parent1:{pw:'parent123',role:'parent',name:'Mr. Danladi Musa'}};
let S,U=null,V='home',sel={};
function seed(){
 const cs={};CLS.forEach((c,i)=>cs[c]=i==0?[...PRE]:i<4?[...NUR]:i<6?[...LP]:[...LP,"French"]);
 const names=[["Esther Danladi","F","Primary 3","parent1"],["Joseph Danladi","M","Primary 1","parent1"],["Mary Okoro","F","Primary 3","p2"],["David Ibrahim","M","Primary 3","p3"],["Ruth Audu","F","Primary 3","p4"],["Daniel Ejeh","M","Primary 3","p5"],["Blessing Umar","F","Primary 1","p6"],["Samuel Agbo","M","Primary 1","p7"]];
 const st=names.map((n,i)=>({id:'SHP/26/'+String(i+1).padStart(3,'0'),name:n[0],g:n[1],cls:n[2],par:n[3],dob:'2017-05-1'+i}));
 const comps=[{k:'CA1',max:10},{k:'CA2',max:10},{k:'Assignment',max:10},{k:'Exam',max:70}];
 const sc={};let n=3;st.forEach(s=>{sc[s.id]={};cs[s.cls].forEach(sub=>{sc[s.id][sub]={};comps.forEach(c=>{n+=7;sc[s.id][sub][c.k]=Math.round(c.max*(0.4+0.55*((n*37%100)/100)))})})});
 const at={};['2026-11-16','2026-11-17','2026-11-18','2026-11-19','2026-11-20'].forEach((d,j)=>{at[d]={};st.forEach((s,i)=>at[d][s.id]=(i+j)%7==0?'A':(i*j)%9==4?'L':'P')});
 return{cs,st,comps,sc,at,grades:[[70,'A','Excellent'],[60,'B','Very Good'],[50,'C','Good'],[40,'D','Fair'],[0,'F','Needs Support']],
 status:{"Primary 3":"Draft","Primary 1":"Published"},
 teach:{teacher1:[{c:"Primary 3",s:"English Studies"},{c:"Primary 3",s:"Mathematics"},{c:"Primary 3",s:"Basic Science"}]},
 asg:[{id:1,c:"Primary 3",s:"Mathematics",t:"Multiplication tables (6 and 7)",d:"Practise and write out the 6 and 7 times tables twice.",due:"2026-11-30"}],sub:{},
 ann:[{id:1,t:"Third week of term: PTA meeting",b:"The PTA meeting holds on Saturday at 10:00 am in the school hall.",a:"All",dt:'2026-11-20'}]}}
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(x){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}
S=load();
const tot=(id,sub)=>S.comps.reduce((a,c)=>a+(+((S.sc[id]||{})[sub]||{})[c.k]||0),0);
const maxT=()=>S.comps.reduce((a,c)=>a+c.max,0);
const gr=t=>{const p=t/maxT()*100;for(const g of S.grades)if(p>=g[0])return g;return S.grades[S.grades.length-1]};
const sum=s=>S.cs[s.cls].reduce((a,x)=>a+tot(s.id,x),0);
const rank=s=>[...S.st.filter(x=>x.cls==s.cls)].sort((a,b)=>sum(b)-sum(a)).findIndex(x=>x.id==s.id)+1;
const att=id=>{let p=0,t=0;for(const d in S.at){const v=S.at[d][id];if(v){t++;if(v=='P'||v=='L'||v=='E')p++}}return{t,p,pct:t?Math.round(p/t*100):0}};
const kids=()=>S.st.filter(s=>s.par==U.u);
const crest=`<svg width="54" height="62" viewBox="0 0 54 62"><path d="M4 4h46v28c0 14-12 22-23 26C16 54 4 46 4 32z" fill="#1f3a5f" stroke="#b8941f" stroke-width="3"/><ellipse cx="27" cy="28" rx="12" ry="8" fill="#fff"/><circle cx="37" cy="23" r="4" fill="#fff"/><path d="M27 8v10M22 13h10" stroke="#b8941f" stroke-width="2"/></svg>`;
const NAV={admin:[['home','Dashboard'],['students','Students'],['classes','Classes & Subjects'],['results','Result Approval'],['announce','Announcements'],['settings','Grading Settings']],teacher:[['home','Dashboard'],['scores','Enter Scores'],['attend','Attendance'],['assign','Assignments']],parent:[['home','My Children'],['results','Results'],['assign','Homework'],['announce','Announcements']]};
function go(v){V=v;R()}
function login(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,x=USERS[u];if(x&&x.pw==p){U={...x,u};V='home';R()}else document.getElementById('err').textContent='Incorrect username or password.'}
function logout(){U=null;R()}
function reset(){if(confirm('Reset all demo data?')){S=seed();save();R()}}
function R(){document.getElementById('root').innerHTML=U?app():loginV()}
function loginV(){return`<div class="login card">${crest}<h2>Shepherd’s International Nursery/Primary School</h2><div class="mut">Akwanga, Nasarawa State</div><p><b style="color:var(--acc)">GRACE, KNOWLEDGE &amp; CHARACTER</b></p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><div id="err" class="bad"></div><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><p class="mut">Demo logins:<br>admin / admin123<br>teacher1 / teach123<br>parent1 / parent123</p></div>`}
function app(){const f={home,students,classes,results,announce,settings,scores,attend,assign}[V];return`<div class="app"><div class="side noprint">${crest}<div><h3>SAMS</h3><small>${e(U.name)}</small></div>${NAV[U.role].map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button onclick="logout()">Sign out</button></div><div class="main">${f()}</div></div>`}
const opts=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${e(x)}</option>`).join('');
function home(){
 if(U.role=='parent')return`<h2>My Children · ${SESS} ${TERM}</h2>`+kids().map(s=>{const a=att(s.id),pub=S.status[s.cls]=='Published',pend=S.asg.filter(x=>x.c==s.cls&&!S.sub[x.id+s.id]).length;return`<div class="card"><h4>${e(s.name)}</h4><div class="mut">${e(s.cls)} · ${e(s.id)}</div><div class="g" style="margin-top:8px"><div class="st"><b>${pub?(sum(s)/s_n(s)).toFixed(1)+'%':'—'}</b><span>Average (${pub?'published':'awaiting publication'})</span></div><div class="st"><b>${pend}</b><span>Outstanding assignments</span></div><div class="st"><b>${a.pct}%</b><span>Attendance</span></div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="sel.kid='${s.id}';go('results')">View result sheet</button><button class="btn sec" onclick="go('assign')">Homework</button></div></div>`}).join('');
 if(U.role=='teacher'){const t=S.teach[U.u]||[];return`<h2>Welcome, ${e(U.name)}</h2><div class="g"><div class="card st"><b>${t.length}</b><span>Class-subject assignments</span></div><div class="card st"><b>${[...new Set(t.map(x=>x.c))].length}</b><span>Classes</span></div><div class="card st"><b>${S.asg.length}</b><span>Assignments sent</span></div></div><div class="card"><h4>Quick actions</h4><div class="row"><button class="btn" onclick="go('attend')">Take attendance</button><button class="btn" onclick="go('scores')">Enter scores</button><button class="btn" onclick="go('assign')">Create assignment</button></div></div><div class="card"><h4>Your classes</h4>${t.map(x=>`<div>${e(x.c)} · ${e(x.s)} <span class="tag ${S.status[x.c]||'Draft'}">${S.status[x.c]||'Draft'}</span></div>`).join('')}</div>`}
 const a=S.st.map(s=>att(s.id).pct),av=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
 return`<h2>Administrator Dashboard · ${SESS} ${TERM}</h2><div class="g"><div class="card st"><b>${S.st.length}</b><span>Students</span></div><div class="card st"><b>${Object.keys(USERS).filter(k=>USERS[k].role=='teacher').length}</b><span>Teachers</span></div><div class="card st"><b>${CLS.length}</b><span>Classes</span></div><div class="card st"><b>${[...new Set(S.st.map(s=>s.par))].length}</b><span>Parents</span></div><div class="card st"><b>${av}%</b><span>Avg attendance</span></div></div><div class="card"><h4>Result submission progress</h4>${CLS.filter(c=>S.st.some(s=>s.cls==c)).map(c=>`<div>${c}: <span class="tag ${S.status[c]||'Draft'}">${S.status[c]||'Draft'}</span></div>`).join('')}</div><div class="card"><button class="btn sec" onclick="reset()">Reset demo data</button></div>`}
const s_n=s=>S.cs[s.cls].length*maxT()/100;
function students(){
 const q=(sel.q||'').toLowerCase(),L=S.st.filter(s=>(sel.fc?s.cls==sel.fc:1)&&(s.name+s.id).toLowerCase().includes(q));
 return`<h2>Students</h2><div class="card"><h4>Register student</h4><div class="row"><input id="nn" placeholder="Full name"><select id="ng"><option>F</option><option>M</option></select><select id="nc">${opts(CLS)}</select><input id="np" placeholder="Parent username"><button class="btn" onclick="addS()">Add</button></div><div class="mut">Student ID is generated automatically. Parent username links the child to a parent account.</div></div><div class="card"><div class="row"><input placeholder="Search name or ID" value="${e(sel.q||'')}" oninput="sel.q=this.value;R()"><select onchange="sel.fc=this.value;R()"><option value="">All classes</option>${opts(CLS,sel.fc)}</select></div><div class="w"><table><tr><th>ID</th><th>Name</th><th>Sex</th><th>Class</th><th>Parent</th></tr>${L.map(s=>`<tr><td>${e(s.id)}</td><td>${e(s.name)}</td><td>${s.g}</td><td>${e(s.cls)}</td><td>${e(s.par)}</td></tr>`).join('')}</table></div></div>`}
function addS(){const n=document.getElementById('nn').value.trim();if(!n)return alert('Enter a name.');const id='SHP/26/'+String(S.st.length+1).padStart(3,'0');S.st.push({id,name:n,g:document.getElementById('ng').value,cls:document.getElementById('nc').value,par:document.getElementById('np').value.trim()||'unlinked',dob:''});S.sc[id]={};save();R()}
function classes(){const c=sel.cc||CLS[6],all=[...new Set([...PRE,...NUR,...LP,"French",...Object.values(S.cs).flat()])];
 return`<h2>Classes &amp; Subjects</h2><div class="card"><select onchange="sel.cc=this.value;R()">${opts(CLS,c)}</select><p class="mut">Tick the subjects offered by this class. Unticked subjects never appear on its score sheets or result sheets.</p>${all.map(x=>`<label style="display:block"><input type="checkbox" ${S.cs[c].includes(x)?'checked':''} onchange="togS('${c}',this.dataset.s,this.checked)" data-s="${e(x)}"> ${e(x)}</label>`).join('')}<div class="row" style="margin-top:10px"><input id="ns" placeholder="New subject"><button class="btn" onclick="newSub('${c}')">Add to ${c}</button></div></div>`}
function togS(c,x,on){S.cs[c]=on?[...S.cs[c],x]:S.cs[c].filter(y=>y!=x);save()}
function newSub(c){const v=document.getElementById('ns').value.trim();if(v&&!S.cs[c].includes(v)){S.cs[c].push(v);save();R()}}
function settings(){const m=maxT();return`<h2>Grading Settings</h2><div class="card"><h4>Assessment components</h4><table>${S.comps.map((c,i)=>`<tr><td>${e(c.k)}</td><td><input type="number" min="0" value="${c.max}" onchange="S.comps[${i}].max=+this.value;save();R()"></td></tr>`).join('')}<tr><td><b>Total</b></td><td><b class="${m==100?'':'bad'}">${m}</b></td></tr></table><div class="mut">Changing maximums affects validation and all totals.</div></div><div class="card"><h4>Grade scale (minimum %)</h4><table>${S.grades.map((g,i)=>`<tr><td><input type="number" value="${g[0]}" onchange="S.grades[${i}][0]=+this.value;save()"></td><td><input value="${e(g[1])}" size="3" onchange="S.grades[${i}][1]=this.value;save()"></td><td><input value="${e(g[2])}" onchange="S.grades[${i}][2]=this.value;save()"></td></tr>`).join('')}</table></div>`}
function scores(){const t=S.teach[U.u]||[],cl=[...new Set(t.map(x=>x.c))],c=sel.sc&&cl.includes(sel.sc)?sel.sc:cl[0],subs=t.filter(x=>x.c==c).map(x=>x.s),su=subs.includes(sel.ss)?sel.ss:subs[0],lock=['Submitted','Approved','Published'].includes(S.status[c]);
 if(!c)return'<h2>Enter Scores</h2><div class="card">No classes assigned.</div>';
 return`<h2>Enter Scores</h2><div class="card"><div class="row"><select onchange="sel.sc=this.value;R()">${opts(cl,c)}</select><select onchange="sel.ss=this.value;R()">${opts(subs,su)}</select><span class="tag ${S.status[c]||'Draft'}">${S.status[c]||'Draft'}</span></div>${lock?'<div class="mut">Locked: results have been submitted or published. Corrections need administrator authorisation.</div>':''}<div class="w"><table><tr><th>Student</th>${S.comps.map(x=>`<th>${e(x.k)} /${x.max}</th>`).join('')}<th>Total</th><th>Grade</th></tr>${S.st.filter(s=>s.cls==c).map(s=>`<tr><td>${e(s.name)}</td>${S.comps.map(x=>`<td><input type="number" ${lock?'disabled':''} min="0" max="${x.max}" value="${((S.sc[s.id]||{})[su]||{})[x.k]??''}" onchange="setSc('${s.id}','${e(su)}','${x.k}',this,${x.max})"></td>`).join('')}<td id="t${s.id.replace(/\W/g,'')}">${tot(s.id,su)}</td><td>${gr(tot(s.id,su))[1]}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:10px"><button class="btn acc" ${lock?'disabled':''} onclick="submitR('${c}')">Submit class results for approval</button></div></div>`}
function setSc(id,su,k,el,max){const v=+el.value;if(v<0||v>max){alert('Score must be between 0 and '+max+'.');el.value='';return}S.sc[id]=S.sc[id]||{};S.sc[id][su]=S.sc[id][su]||{};S.sc[id][su][k]=v;save();R()}
function submitR(c){if(confirm('Submit all '+c+' results? Scores will be locked.')){S.status[c]='Submitted';save();R()}}
function results(){
 if(U.role=='parent'){const K=kids(),s=K.find(x=>x.id==sel.kid)||K[0];if(!s)return'<h2>Results</h2><div class="card">No children linked.</div>';
  return`<h2>Academic Results</h2><div class="row noprint">${K.map(k=>`<button class="btn ${k.id==s.id?'':'sec'}" onclick="sel.kid='${k.id}';R()">${e(k.name)}</button>`).join('')}</div>`+(S.status[s.cls]=='Published'?sheet(s)+'<button class="btn noprint" onclick="print()">Print / Save as PDF</button>':'<div class="card">Results for '+e(s.cls)+' have not been published yet. You will see them here once the school releases them.</div>')}
 const rows=CLS.filter(c=>S.st.some(s=>s.cls==c));
 return`<h2>Result Approval &amp; Publication</h2><div class="card w"><table><tr><th>Class</th><th>Status</th><th>Action</th></tr>${rows.map(c=>{const t=S.status[c]||'Draft';return`<tr><td>${c}</td><td><span class="tag ${t}">${t}</span></td><td>${t=='Submitted'?`<button class="btn" onclick="setSt('${c}','Approved')">Approve</button> <button class="btn sec" onclick="setSt('${c}','Draft')">Request correction</button>`:t=='Approved'?`<button class="btn acc" onclick="setSt('${c}','Published')">Publish to parents</button>`:t=='Published'?`<button class="btn sec" onclick="if(confirm('Unlock for correction? This will be recorded.'))setSt('${c}','Draft')">Unlock</button>`:'<span class="mut">Awaiting teacher</span>'}</td></tr>`}).join('')}</table></div><div class="card"><h4>Preview a result sheet</h4><select onchange="sel.pv=this.value;R()"><option value="">Choose student</option>${S.st.map(s=>`<option value="${s.id}" ${sel.pv==s.id?'selected':''}>${e(s.name)}</option>`).join('')}</select></div>`+(sel.pv?sheet(S.st.find(s=>s.id==sel.pv)):'')}
function setSt(c,v){S.status[c]=v;save();R()}
function sheet(s){const subs=S.cs[s.cls],T=sum(s),M=subs.length*maxT(),p=M?T/M*100:0,a=att(s.id),g=gr(maxT()*p/100);
 return`<div class="card sheet"><div class="sh">${crest}<div><b style="font-size:18px">SHEPHERD’S INTERNATIONAL NURSERY/PRIMARY SCHOOL</b><div class="mut">P.M.B. 12, Akwanga, Nasarawa State · shepherdsinpsa@gmail.com</div><b>${SESS} ${TERM.toUpperCase()} RESULT SHEET</b></div></div><div class="g" style="margin-bottom:8px"><div><b>Name:</b> ${e(s.name)}</div><div><b>Admission No:</b> ${e(s.id)}</div><div><b>Class:</b> ${e(s.cls)}</div><div><b>In class:</b> ${S.st.filter(x=>x.cls==s.cls).length}</div><div><b>Attendance:</b> ${a.p}/${a.t} days (${a.pct}%)</div></div><div class="w"><table><tr><th>Subject</th>${S.comps.map(c=>`<th>${e(c.k)}</th>`).join('')}<th>Total</th><th>Grade</th><th>Remark</th></tr>${subs.map(x=>{const t=tot(s.id,x),h=gr(t);return`<tr><td>${e(x)}</td>${S.comps.map(c=>`<td>${((S.sc[s.id]||{})[x]||{})[c.k]??'-'}</td>`).join('')}<td><b>${t}</b></td><td>${h[1]}</td><td>${h[2]}</td></tr>`}).join('')}</table></div><div class="g" style="margin-top:10px"><div class="st"><b>${T}/${M}</b><span>Total marks</span></div><div class="st"><b>${p.toFixed(1)}%</b><span>Average</span></div><div class="st"><b>${rank(s)}</b><span>Position</span></div><div class="st"><b>${g[1]}</b><span>${g[2]}</span></div></div><p><b>Class teacher’s comment:</b> ${p>=60?'A commendable result. Keep up the good work.':p>=45?'A fair result. More effort is needed in the weaker subjects.':'Needs extra support. Please work with the teacher on the weak subjects.'}</p><div class="row" style="justify-content:space-between;margin-top:20px"><span>Class Teacher: ____________</span><span>Headteacher: ____________</span></div></div>`}
function attend(){const t=S.teach[U.u]||[],cl=[...new Set(t.map(x=>x.c))],c=sel.ac&&cl.includes(sel.ac)?sel.ac:cl[0];if(!c)return'<h2>Attendance</h2>';S.at[TODAY]=S.at[TODAY]||{};
 return`<h2>Attendance · ${TODAY}</h2><div class="card"><select onchange="sel.ac=this.value;R()">${opts(cl,c)}</select><table>${S.st.filter(s=>s.cls==c).map(s=>`<tr><td>${e(s.name)}</td><td><select onchange="S.at['${TODAY}']['${s.id}']=this.value;save()"><option value="">-</option>${['P','A','L','E'].map(v=>`<option value="${v}" ${S.at[TODAY][s.id]==v?'selected':''}>${{P:'Present',A:'Absent',L:'Late',E:'Excused'}[v]}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
function assign(){
 const mine=U.role=='teacher'?[...new Set((S.teach[U.u]||[]).map(x=>x.c))]:[...new Set(kids().map(k=>k.cls))],L=S.asg.filter(a=>mine.includes(a.c));
 let form='';if(U.role=='teacher'){const t=S.teach[U.u]||[];form=`<div class="card"><h4>New assignment</h4><div class="row"><select id="ac">${opts([...new Set(t.map(x=>x.c))])}</select><select id="as">${opts([...new Set(t.map(x=>x.s))])}</select><input id="at" placeholder="Title"><input id="ad" type="date"></div><textarea id="ai" rows="3" style="width:100%" placeholder="Instructions"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="addA()">Send to parents</button></div></div>`}
 return`<h2>${U.role=='parent'?'Homework':'Assignments'}</h2>${form}`+(L.map(a=>`<div class="card"><b>${e(a.t)}</b> <span class="tag">${e(a.c)} · ${e(a.s)}</span><div>${e(a.d)}</div><div class="mut">Due ${e(a.due||'-')}</div>${U.role=='parent'?kids().filter(k=>k.cls==a.c).map(k=>`<div class="row">${e(k.name)}: ${S.sub[a.id+k.id]?'<span class="tag Published">Submitted</span>':`<button class="btn sec" onclick="S.sub['${a.id+k.id}']=1;save();R()">Mark as submitted</button>`}</div>`).join(''):`<div class="mut">Submitted by ${S.st.filter(s=>s.cls==a.c&&S.sub[a.id+s.id]).length} of ${S.st.filter(s=>s.cls==a.c).length}</div>`}</div>`).join('')||'<div class="card">No assignments yet.</div>')}
function addA(){const t=document.getElementById('at').value.trim();if(!t)return alert('Add a title.');S.asg.push({id:Date.now(),c:document.getElementById('ac').value,s:document.getElementById('as').value,t,d:document.getElementById('ai').value,due:document.getElementById('ad').value});save();R()}
function announce(){const f=U.role=='admin'?`<div class="card"><h4>New announcement</h4><div class="row"><input id="nt" placeholder="Title"><select id="na"><option>All</option><option>Nursery</option><option>Primary</option><option>Teachers</option></select></div><textarea id="nb" rows="3" style="width:100%" placeholder="Message"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="addN()">Publish</button></div></div>`:'';
 return`<h2>Announcements</h2>${f}`+[...S.ann].reverse().map(a=>`<div class="card"><b>${e(a.t)}</b> <span class="tag">${e(a.a)}</span> <span class="mut">${a.dt}</span><div>${e(a.b)}</div></div>`).join('')}
function addN(){const t=document.getElementById('nt').value.trim();if(!t)return;S.ann.push({id:Date.now(),t,b:document.getElementById('nb').value,a:document.getElementById('na').value,dt:TODAY});save();R()}
R();
